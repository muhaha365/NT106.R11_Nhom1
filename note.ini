4. Sau đó _connection sẽ gọi phương thức ReceiveLoopAsync để nhận dữ liệu từ server, tuy nhiên tôi không hiểu rằng chỉ có client và server kết nối thôi thì sao mà client biết được server đã gửi những gì mà khi không nhận được thì ngắt kết nối.
5. Khi server dừng lại bằng cách bấm ctrl + c, server sẽ dừng lại và sẽ dispose từng client trong List<ConnectedClient> clients, sau đó client sẽ biết được bị ngắt kết nối và sẽ thoát khỏi vòng lặp, hiển thị MessageBox, tuy nhien vẫn câu hỏi ở trên làm sao mà client biết được server đã ngắt kết nối thông qua server dispose
