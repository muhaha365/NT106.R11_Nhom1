Ok bạn hãy tiếp tục hướng dẫn tôi hoàn thiện client-server để có thể chat tin nhắn với nhau, kết nối với PacketIO và Packet
===
Hiện tại tôi hiểu được code của tôi như sau:
1. Client khởi tạo một packet với type = "chat" và payload = "xin chào từ client" sau đó mã hóa "xin chào từ client" thành JsonElement (tôi không hiểu chỗ này lắm)
2. Client gọi phương thức SendAsync của lớp ClientConnection để gửi packet tới server, SendAsync sẽ gọi tiếp tới đối tượng _packetIO của lơp PacketIO (có constructor nhận vào là 1 stream của tcpClient) để gửi packet tới server thông qua phương thức SendPacketAsync của lớp PacketIO.
3. Phương thức SendPacketAsync của lớp PacketIO này tiếp tục chuyển packet thành chuỗi json thông qua JsonSerializer.Serialize(packet) và được ghi lên stream của tcpClient thông qua WriteAsync của _sr
4. Server nhận được chuỗi json này thông qua phương thức ReceivePacketAsync của đối tượng packetIO. Tuy nhiên tôi không biết tại sao lại gửi thẳng lên chatserver như vậy mà lại không gửi qua connectedClient, tôi không hiểu chỗ này lắm.
5. Thông qua phương thức ReceivePacketAsync của lớp PacketIO, chuỗi json này sẽ được mã hóa thành packet và từ đó server sẽ phân loại packet theo type và hiện từ payload ra lấy ra dạng chuỗi để in hiển thị ra console
