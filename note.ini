Client khởi tạo một string = "Login|{username}|{passwordHash}" và gửi tới server thông qua phương thức SendAsync của lớp ClientConnection.
SendAysnc sẽ lấy stream của tcpClient đang hiện hành và chuyển string sang byte[] bằng Encoding.UTF8.GetBytes[string] và gửi tới server thông qua lệnh WriteAsync ghi lên stream.
server sẽ nhận được luồng byte[] này thông qua ReadAsync, đọc dữ liệu trên stream. sau đó chuyển laij thành string thông qua Encoding.UTF8.GetString(buffer, 0, bytesRead) và hiển thị ra console.
