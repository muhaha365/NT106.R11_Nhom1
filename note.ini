Hiện tại tôi đã code được như sau:
1. Chạy server: Khởi tạo một đối tượng server và gọi phương thức Run với cancellation token. Server sẽ khởi tạo một TcpListener và lắng nghe các kết nối từ client. Khi có một client kết nối, server sẽ tạo một đối tượng ConnectedClient và thêm vào danh sách _clients. Server cũng sẽ xử lý từng client trong một luồng riêng thông qua phương thức HandleClientAsync.Trong HandleClientAsync, server sẽ xử lý nhận tin nhắn, kiểm tra, gửi tới client khác, dọn dẹp khi client ngắt kết nối. Xử lý nhận, gửi thông qua lớp PacketIO cùng phương thức SendAsync, ReceiveAsync.
2. Chạy client: khởi tạo _connection của lớp ClientConnection, gọi phương thức ConnectAsync để kết nối tới server. Khi kết nối thành công, client có thể gọi phương thức SendAsync để gửi tin nhắn tới server hoặc ReceiveAsync để nhận tin từ server thông qua lớp ClientConnection và sẽ xuống lớp PacketIO.
