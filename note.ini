Tôi đang làm đồ án môn học lập trình mạng, đồ án của tôi là về ứng dụng chat với các tính năng như sau:
- Đăng nhập/Đăng ký (Email, SĐT, Google)
- Danh sách bạn bè (Tìm kiếm, thêm, xóa)
- Nhắn tin cá nhân (Real-time, trạng thái "đã xem", "đang nhập...")
- Nhắn tin nhóm (Tạo nhóm, quản lý thành viên)
- Gửi file, hình ảnh, video (Xem trước, giới hạn dung lượng)
- Thông báo đẩy (Tin nhắn mới, yêu cầu kết bạn)
Hiện tại nhóm tôi đã code được sơ sơ về client-server, đã có thể chat được tin nhắn. Bạn hãy đọc source code của tôi hiện tại: C:\Users\longlong\Documents\DaiHoc\HK1 2026-2027\LTMCB\Lab\Do_an, phân tích kiến trúc app hiện tại, phân tích luồng logic đi như thế nào, sau đó hướng dẫn tôi triển khai code tiếp những tính năng cơ bản trong đồ án của tôi, để tôi có thể hoàn thiện đồ án. 
Sắp tới nhóm tôi sẽ sử dụng supabase làm database thay cho sql server như hiện tại, cho nên bây giờ sẽ ko đụng vô database, với cả phần protocol client, bạn tôi sẽ sửa code cho đơn giản hơn nên cũng không động vào. Thứ tôi cần bây giờ là hoàn thiện client-server, triển khai các tính năng có trong list trên, để tôi có thể hoàn thiện đồ án. Bài lab 3: c:\Users\longlong\Documents\DaiHoc\HK1 2026-2027\LTMCB\Lab\Lab 3 - Working with Sockets in C# - 2019.pdf
